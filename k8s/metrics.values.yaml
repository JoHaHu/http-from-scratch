defaultDatasources:
  victorialogs:
    datasources:
      - name: VictoriaLogs (DS)
        uid: VictoriaLogs
        access: proxy
        type: victoriametrics-logs-datasource
        plugin: true
        jsonData:
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              urlDisplayLabel: "View Trace in VictoriaTraces"
              datasourceUid: VictoriaTraces
    victoriatraces:
      datasources:
        - name: VictoriaTraces
          uid: VictoriaTraces
          access: proxy
          type: jaeger
          jsonData:
            tracesToLogsV2:
              datasourceUid: VictoriaLogs
              filterByTraceID: true
              filterBySpanID: true
              spanStartTimeShift: "-2m"
              spanEndTimeShift: "2m"
              customQuery: true
              query: 'trace_id:="$${__span.traceId}"'


vlsingle:
  enabled: true

vlagent:
  enabled: true
  spec:
    k8sCollector:
      enabled: true
      includePodLabels: true
      includePodAnnotations: true
      streamFields:
        - kubernetes.pod_namespace
        - kubernetes.container_name
        - kubernetes.pod_labels.app
        - kubernetes.pod_labels.app.kubernetes.io/name"
vtsingle:
  enabled: true

vmagent:
  enabled: true

grafana:
  plugins:
    - victoriametrics-logs-datasource
  grafana.ini:
    server:
      domain: localhost
      root_url: "%(protocol)s://%(domain)s/grafana/"
      serve_from_sub_path: true
  route:
    main:
      enabled: true
      hostnames:
        - localhost
      parentRefs:
        - name: eg
          namespace: envoy-gateway-system
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: /grafana
