apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      name: server
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: server
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
      restartPolicy: Always
---
kind: Service
apiVersion: v1
metadata:
  name: server
  labels:
    app: server
spec:
  selector:
    app: server
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: server-scrape
  labels:
    app: server
spec:
  selector:
    matchLabels:
      app: server
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
kind: HTTPRoute
apiVersion: gateway.networking.k8s.io/v1
metadata:
  name: server
spec:
  parentRefs:
    - name: eg
      namespace: envoy-gateway-system
  hostnames:
    - localhost
  rules:
    - backendRefs:
        - name: server
          port: 8080
      matches:
        - path:
            value: "/server"
            type: PathPrefix
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: "/"