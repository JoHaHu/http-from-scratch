apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  labels:
    app: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: server
  template:
    metadata:
      name: server
      labels:
        app: server
    spec:
      containers:
        - name: server
          image: server
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              protocol: TCP
              name: http
      restartPolicy: Always
---
kind: Service
apiVersion: v1
metadata:
  name: server
  labels:
    app: server
spec:
  selector:
    app: server
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: server-scrape
  labels:
    app: server
spec:
  selector:
    matchLabels:
      app: server
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
